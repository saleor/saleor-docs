name: Update 3.x docs to the latest Saleor release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # every night at 02:00 UTC

env:
  HUSKY: 0

jobs:
  check_saleor_release:
    name: Update API reference based on the latest Saleor release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Get latest release info
        id: release
        run: |
          echo "Fetching latest release info..."
          tag=$(curl -s https://api.github.com/repos/saleor/saleor/releases/latest | jq -r '.tag_name')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest Saleor release: $tag"

      # Rolling cache: restore-keys picks up the most recent previous cache,
      # and we save a fresh one each run keyed by run_id (cache keys are immutable).
      - name: Restore last scanned release
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .last-release
          key: saleor-release-${{ github.run_id }}
          restore-keys: saleor-release-

      - name: Check for new release
        id: check
        run: |
          last=$(cat .last-release 2>/dev/null || echo "")
          if [[ "$last" == "${{ steps.release.outputs.tag }}" ]]; then
            echo "No new Saleor release since $last, skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release: ${{ steps.release.outputs.tag }} (was: ${last:-none})"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: steps.check.outputs.new == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.new == 'true'
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Download schema.graphql
        if: steps.check.outputs.new == 'true'
        run: |
          tag="${{ steps.release.outputs.tag }}"
          echo "Fetching schema.graphql from saleor@$tag..."
          curl -fL -o schema.graphql \
            "https://raw.githubusercontent.com/saleor/saleor/$tag/saleor/graphql/schema.graphql"

      - name: Install dependencies
        if: steps.check.outputs.new == 'true'
        run: pnpm install --frozen-lockfile

      - name: Update API reference
        if: steps.check.outputs.new == 'true'
        run: pnpm run update-api-reference

      - name: Lint changes
        if: steps.check.outputs.new == 'true'
        run: pnpm run lint

      - name: Create Pull Request
        if: steps.check.outputs.new == 'true'
        uses: peter-evans/create-pull-request@4e1beaa7521e8b457b572c090b25bd3db56bf1c5 # v5.0.3
        with:
          branch: bot-update-api-reference
          commit-message: "Update API reference to the ${{ steps.release.outputs.tag }} Saleor release"
          title: "Update API reference to the ${{ steps.release.outputs.tag }} Saleor release"
          body: |
            Pull request auto-generated by bot for Saleor release ${{ steps.release.outputs.tag }}.
          labels: |
            :robot: bot
          team-reviewers: engineering

      # Record the scanned tag only after a successful run so a failure retries next night.
      - name: Record scanned release
        if: steps.check.outputs.new == 'true'
        run: echo "${{ steps.release.outputs.tag }}" > .last-release

      - name: Save last scanned release
        if: steps.check.outputs.new == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .last-release
          key: saleor-release-${{ github.run_id }}
