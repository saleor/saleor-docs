name: Update 3.x docs to the latest Saleor release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # every night at 02:00 UTC

env:
  HUSKY: 0

permissions:
  contents: read

jobs:
  check_saleor_release:
    name: Check for a new Saleor release
    runs-on: ubuntu-22.04
    outputs:
      new: ${{ steps.check.outputs.new }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Get latest release info
        id: release
        run: |
          tag=$(curl -s https://api.github.com/repos/saleor/saleor/releases/latest | jq -r '.tag_name')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest Saleor release: $tag"

      # Rolling cache: restore-keys picks up the most recent previous cache,
      # and we save a fresh one each run keyed by run_id (cache keys are immutable).
      - name: Restore last scanned release
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .last-release
          key: saleor-release-${{ github.run_id }}
          restore-keys: saleor-release-

      - name: Check for new release
        id: check
        run: |
          last=$(cat .last-release 2>/dev/null || echo "")
          if [[ "$last" == "${{ steps.release.outputs.tag }}" ]]; then
            echo "No new Saleor release since $last, skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release: ${{ steps.release.outputs.tag }} (was: ${last:-none})"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  update_api_reference:
    name: Update API reference and open PR
    needs: check_saleor_release
    if: needs.check_saleor_release.outputs.new == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write # push the bot branch
      pull-requests: write # open the PR
    env:
      TAG: ${{ needs.check_saleor_release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Download schema.graphql
        run: |
          echo "Fetching schema.graphql from saleor@$TAG..."
          curl -fL -o schema.graphql \
            "https://raw.githubusercontent.com/saleor/saleor/$TAG/saleor/graphql/schema.graphql"

      - run: pnpm install --frozen-lockfile

      - name: Update API reference
        run: pnpm run update-api-reference

      - name: Lint changes
        run: pnpm run lint

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@4e1beaa7521e8b457b572c090b25bd3db56bf1c5 # v5.0.3
        with:
          branch: bot-update-api-reference
          commit-message: "Update API reference to the ${{ env.TAG }} Saleor release"
          title: "Update API reference to the ${{ env.TAG }} Saleor release"
          body: |
            Pull request auto-generated by bot for Saleor release ${{ env.TAG }}.
          labels: |
            :robot: bot
          team-reviewers: engineering

      # Record the scanned tag only after a successful run so a failure retries next night.
      - name: Save last scanned release
        run: echo "$TAG" > .last-release
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .last-release
          key: saleor-release-${{ github.run_id }}
