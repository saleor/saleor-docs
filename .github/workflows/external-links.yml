name: Check external links

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check external links in source content
        id: source-links
        run: pnpm validate:external
        continue-on-error: true
      - name: Build rendered documentation
        run: pnpm build
      - name: Check external links in rendered output
        id: rendered-links
        run: pnpm audit:external
        continue-on-error: true
      - name: Fail when either link check found errors
        if: steps.source-links.outcome != 'success' || steps.rendered-links.outcome != 'success'
        run: exit 1
