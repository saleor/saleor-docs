questions:
  - id: public-products-auth
    question: Do I need an app token to retrieve public product data for a storefront?
    expected:
      - Public product data can be retrieved without a token.
      - An app or user token is needed for operations requiring permissions.
    routes: /api-usage/authentication
  - id: authorization-header
    question: How do I send an app token with a Saleor GraphQL request?
    expected:
      - Send the token in the Authorization header using the Bearer scheme.
    routes: /api-usage/authentication
  - id: cart-versus-checkout
    question: Should I create a cart object before creating a checkout in Saleor?
    expected:
      - Saleor uses the checkout object for both the cart and checkout; there is no separate cart model.
    routes: /developer/checkout/overview
  - id: checkout-channel
    question: How do I choose the channel and products when creating a checkout?
    expected:
      - Pass the channel slug when creating the checkout.
      - Checkout lines use variant IDs and quantities.
    routes: /developer/checkout/api-guide
  - id: channel-currency
    question: Can one Saleor channel have multiple currencies?
    expected:
      - A channel belongs to a single currency.
      - Multiple channels can be used for different markets or regions.
    routes: /developer/channels/overview
  - id: app-sdk-install
    question: How do I install the Saleor App SDK using pnpm?
    expected:
      - Run pnpm add @saleor/app-sdk.
    routes: /developer/extending/apps/developing-apps/app-sdk/overview
  - id: checkout-problem-upgrade
    question: Why can problem.line break after upgrading to Saleor 3.23, and how should I change my code?
    expected:
      - Some checkout problems in 3.23 do not have a line field.
      - Check __typename for CheckoutLineProblemVariantNotAvailable before accessing line.
    routes: /upgrade-guides/core/3-22-to-3-23
